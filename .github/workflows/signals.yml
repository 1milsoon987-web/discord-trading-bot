name: Trading signals

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Label shown in the daily-brief title"
        required: false
        default: "Manual run"
  schedule:
    # All times are UTC. Africa/Algiers = UTC+1 (no DST).
    # London session open: 06:00 UTC = 07:00 Algiers
    - cron: "0 6 * * *"
    # New York session open: 13:30 UTC = 14:30 Algiers
    - cron: "30 13 * * *"

concurrency:
  group: trading-signals
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      TIMEZONE: Africa/Algiers
      MIN_CONFIDENCE_SCORE: "65"
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Resolve run label
        id: label
        env:
          INPUT_LABEL: ${{ github.event.inputs.label }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_LABEL" ]; then
            label="$INPUT_LABEL"
          else
            case "$SCHEDULE_CRON" in
              "0 6 * * *")   label="London session open (07:00 Algiers)" ;;
              "30 13 * * *") label="New York session open (14:30 Algiers)" ;;
              *)             label="Scheduled run" ;;
            esac
          fi
          echo "value=$label" >> "$GITHUB_OUTPUT"

      - name: Generate signals and post to Discord webhook
        run: |
          python -m bot.main --webhook --label "${{ steps.label.outputs.value }}"
